name: insurance-group-interview
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: insurance_interview
      POSTGRES_USER: insurance_interview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/configure.mjs first}
    ports:
      - "127.0.0.1:55462:5432"
    volumes:
      - interview-postgres:/var/lib/postgresql/data
    mem_limit: 256m
    cpus: 0.5
    shm_size: 64m
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=30", "-c", "work_mem=2MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurance_interview -d insurance_interview"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  interview-postgres:
